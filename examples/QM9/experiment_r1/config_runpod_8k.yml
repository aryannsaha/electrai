# RunPod single-node QM9 residual flow training config.

data:
  _target_: electrai.dataloader.dataset.RhoRead
  root: /workspace/data/qm9/qm9_filelist.txt
  split_file: /workspace/data/qm9/splits/split_8000.json
  precision: f32
  batch_size: 1
  train_workers: 8
  val_workers: 2
  pin_memory: true
  val_frac: 0.005
  drop_last: false
  augmentation: false
  random_seed: 42
  downsample_label: 1
  downsample_data: 1

model:
  _target_: electrai.model.resunet_time_cond.ResUNet3dTimeCond
  in_channels: 1
  out_channels: 1
  n_channels: 32
  depth: 1
  n_residual_blocks: 32
  kernel_size: 5

training_mode: flow_match_with_time_res
source_distribution: zero_mean_gaussian
source_noise_scale: 0.04
ckpt_path: /workspace/electrai/examples/QM9/experiment_r1/checkpoints_runpod_8k_residual
checkpoint_monitor: val_rollout_sq_fro
checkpoint_mode: min
precision: 32
epochs: 50
nbatch: 1
lr: 1e-6
weight_decay: 0.0
warmup_length: 1
beta1: 0.9
beta2: 0.99
n_inference_steps: 3
eps: 1.0e-4

wandb_mode: online
entity: rosengroup-general
wb_pname: electrai
wandb_run_id: runpod_qm9_8k_res_cond_gaussian_noise004
wandb_run_name: runpod_qm9_8k_res_cond_gaussian_noise004
wandb_resume: allow

normalize: true
